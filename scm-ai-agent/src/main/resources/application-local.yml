# 本地 AI Agent 调试配置。
# 使用方式：
# 1. IDEA 的 ScmAiAgentApplication -> Active profiles 填 local。
# 2. Environment variables 里只保留真实密钥，例如 DASHSCOPE_API_KEY=你的本地 key。
# 3. 不要把真实 API Key 写入本文档或提交到 Git。

spring:
  cloud:
    nacos:
      discovery:
        enabled: true
      config:
        enabled: true
  ai:
    model:
      # local profile 默认启用 DashScope 的真实 Chat / Embedding。
      chat: dashscope
      embedding: dashscope
    dashscope:
      enabled: true
      api-key: ${DASHSCOPE_API_KEY:}
      base-url: https://dashscope.aliyuncs.com
      chat:
        enabled: true
        api-key: ${DASHSCOPE_API_KEY:}
        base-url: https://dashscope.aliyuncs.com
        options:
          model: qwen-plus
      embedding:
        enabled: true
        api-key: ${DASHSCOPE_API_KEY:}
        base-url: https://dashscope.aliyuncs.com
        options:
          model: text-embedding-v3
          dimensions: 1024

ai:
  agent:
    rag:
      embedding:
        # local profile 默认使用真实 DashScope embedding，提升 RAG 语义检索效果。
        mode: dashscope
        provider: dashscope
        model: text-embedding-v3
        dimension: 1024
        api-key-env: DASHSCOPE_API_KEY
        rerank-enabled: false
      vector-store:
        # local profile 默认写入本地 Milvus，和 application.yml 的 in-memory 隔离。
        mode: milvus
        milvus:
          uri: http://localhost:19530
          token:
          # 使用 1024 维 collection，避免和 mock embedding 64 维 collection 冲突。
          collection-name: scm_ai_rag_chunks_embedding_v3
          primary-field: chunk_id
          vector-field: embedding
          metric-type: COSINE
          index-type: AUTOINDEX
      registry:
        # local profile 默认使用 MySQL 持久化；如需临时无数据库启动，可改为 in-memory。
        mode: mysql
        mysql:
          url: jdbc:mysql://127.0.0.1:3306/scm_ai_agent?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
          username: root
          password: 123456
      docs-import:
        enabled: true
        root-path: docs
        knowledge-base-id: kb-project-docs
        include-directories: architecture,business,operations,database
        supported-extensions: .md
        max-files: 100
      retrieval:
        default-top-k: 5
        max-top-k: 10
        score-threshold: 0
        max-context-chunks: 5
        max-context-chunk-length: 1200
    tools:
      # local profile 默认联调真实业务服务；如只想本地 mock，可改回 mock。
      adapter-mode: http
      http:
        inventory-base-url: http://localhost:18084
        mdm-base-url: http://localhost:18082
        sales-base-url: http://localhost:18085
        purchase-base-url: http://localhost:18083
        connect-timeout-ms: 3000
        read-timeout-ms: 5000
      audit:
        mode: mysql
        max-records: 500
    tool-calling:
      # local profile 默认走真实 Spring AI Planner，而不是 mock planner。
      planner-mode: spring-ai
      answer-mode: spring-ai
      spring-ai-planner:
        enabled: true
        fallback-to-mock: false
        max-retries: 1
        task-type: tool_calling
      spring-ai-answer:
        enabled: true
        fallback-to-template: true
        max-retries: 1
        task-type: tool_calling_answer
      orchestrator:
        enabled: true
        record-runs: true
        max-records: 100
        plan-mode: MULTI_STEP_CONTROLLED
        max-steps: 2
        multi-step-enabled: true
        dry-run-enabled: false
        controlled-execution-enabled: true
        max-executable-steps: 2
        allow-second-step-read-only: true
