# 本地 AI Agent 调试配置。
#
# 使用方式：
# 1. IDEA 的 ScmAiAgentApplication -> Active profiles 填 local。
# 2. Environment variables 里只保留真实密钥，例如 DASHSCOPE_API_KEY=你的本地 key。
# 3. 不要把真实 API Key 写入本文件或提交到 Git。

spring:
  cloud:
    nacos:
      discovery:
        enabled: true
      config:
        enabled: true
  ai:
    model:
      # 本地验证真实 embedding 时启用 DashScope；Chat 默认仍可按接口 providerMode 控制。
      embedding: dashscope
    dashscope:
      enabled: true
      api-key: ${DASHSCOPE_API_KEY:}
      base-url: https://dashscope.aliyuncs.com
      embedding:
        enabled: true
        api-key: ${DASHSCOPE_API_KEY:}
        base-url: https://dashscope.aliyuncs.com
        options:
          model: text-embedding-v3
          dimensions: 1024

ai:
  agent:
    rag:
      embedding:
        # 本地 local profile 默认使用真实 DashScope embedding，提升 RAG 语义检索效果。
        mode: dashscope
        provider: dashscope
        model: text-embedding-v3
        dimension: 1024
        api-key-env: DASHSCOPE_API_KEY
        rerank-enabled: false
      vector-store:
        # local profile 默认写入本地 Milvus，和默认 application.yml 的 in-memory 隔离。
        mode: milvus
        milvus:
          uri: http://localhost:19530
          token:
          # 使用新 collection，避免和 mock embedding 64 维 collection 冲突。
          collection-name: scm_ai_rag_chunks_embedding_v3
          primary-field: chunk_id
          vector-field: embedding
          metric-type: COSINE
          index-type: AUTOINDEX
      docs-import:
        enabled: true
        root-path: docs
        knowledge-base-id: kb-project-docs
        include-directories: architecture,business,operations,database
        supported-extensions: .md
        max-files: 100
